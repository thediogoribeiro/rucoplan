services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: production_planning
      POSTGRES_USER: production_planning
      POSTGRES_PASSWORD: production_planning
    ports:
      - "${PRODUCTION_PLANNING_POSTGRES_PORT:-15433}:5432"
    volumes:
      - production-planning-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production_planning -d production_planning"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRODUCTION_PLANNING_DB_URL: jdbc:postgresql://postgres:5432/production_planning
      PRODUCTION_PLANNING_DB_USERNAME: production_planning
      PRODUCTION_PLANNING_DB_PASSWORD: production_planning
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:-development-only-change-this-token-secret}
      APP_WHATSAPP_INTEGRATION_TOKEN: ${APP_WHATSAPP_INTEGRATION_TOKEN:-development-whatsapp-token}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "${SERVER_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  production-planning-postgres:
